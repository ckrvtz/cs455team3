# small: 2L / 128d / 4H, T=256, B=32 (ROADMAP §2.1). Tied: 1,709,568 params.
# Run values set in P5.2 (docs/RUNS.md): one epoch of the 20M-token subset (2,441 steps/epoch
# at 32 x 256) is 2,400 steps; validation every 100 steps on 20 x 32 x 256 = 163,840 val tokens;
# checkpoints every 250 steps so an interrupted run resumes with --resume <run>/ckpt_latest.bin.
vocab_size=10000
max_seq_len=256
n_layer=2
n_embd=128
n_head=4
tie_embeddings=1

run_name=small
batch_size=32
seq_len=256
max_steps=2400
warmup_steps=200
lr=1e-3
log_every=10
eval_every=100
val_batches=20
ckpt_every=250
