# smoke: 1L / 32d / 2H, T=32, B=4 (ROADMAP §2.1). CI-speed end-to-end test.
# Tuned in P4.5 (docs/DECISIONS.md): lr=1e-2 passes both ROADMAP §10 rows, the overfit test
# (one batch, 300 steps, loss < 0.1) and the smoke test (val < 6.0 after 200 steps);
# val_batches=32 = 4096 val tokens, the size of tests/fixtures/smoke_val.bin.
vocab_size=10000
max_seq_len=32
n_layer=1
n_embd=32
n_head=2
tie_embeddings=1

run_name=smoke
batch_size=4
seq_len=32
max_steps=200
warmup_steps=20
lr=1e-2
log_every=10
eval_every=50
val_batches=32
ckpt_every=0
